<line x1="141.9" y1="157.7" x2="175.2" y2="151.6" stroke="#0c1f33" stroke-width="0.7" opacity="0.35"/>
<line x1="164.7" y1="171.6" x2="197.6" y2="165.2" stroke="#0c1f33" stroke-width="0.7" opacity="0.35"/>
<polygon points="157.1,137.2 190.8,131.4 256.5,171.3 224.1,178.0" fill="url(#panelWarm)" stroke="#081426" stroke-width="1.4" stroke-linejoin="round"/>
<line x1="179.4" y1="150.8" x2="212.7" y2="144.7" stroke="#0c1f33" stroke-width="0.7" opacity="0.35"/>
<line x1="201.8" y1="164.4" x2="234.6" y2="158.0" stroke="#0c1f33" stroke-width="0.7" opacity="0.35"/>
<polygon points="195.1,130.7 228.8,124.9 293.0,163.9 260.6,170.5" fill="url(#panelWarm)" stroke="#081426" stroke-width="1.4" stroke-linejoin="round"/>
<line x1="216.9" y1="144.0" x2="250.2" y2="137.9" stroke="#0c1f33" stroke-width="0.7" opacity="0.35"/>
<line x1="238.8" y1="157.2" x2="271.6" y2="150.9" stroke="#0c1f33" stroke-width="0.7" opacity="0.35"/>
  <polygon points="140,206 320,168 320,196 140,240" fill="url(#wallFace)"/>
  <polygon points="60,150 140,206 140,240 60,196" fill="url(#wallShade)"/>
</g>
<g><rect x="420" y="112" width="90" height="128" rx="10" fill="#123047" stroke="#0c1f33" stroke-width="4"/>
<rect x="436" y="130" width="58" height="12" rx="6" fill="#1f6f5c"/>
<rect x="436" y="150" width="58" height="12" rx="6" fill="#1f6f5c"/>
<rect x="436" y="170" width="58" height="12" rx="6" fill="#ffb703"/>
<path d="M470,196 l-16,26 h13 l-7,22 20,-30 h-13 z" fill="#ffb703"/>
<circle cx="465" cy="96" r="34" fill="#ffb703" opacity="0.25"/></g>
<path d="M330,168 Q378,150 414,150" stroke="#ffb703" stroke-width="7" stroke-dasharray="16 12" fill="none" stroke-linecap="round"/>
<rect width="640" height="260" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:multiply"/>
</svg>
