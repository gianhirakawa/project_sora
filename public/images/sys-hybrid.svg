  <polygon points="81.1,150.3 114.9,144.5 183.5,186.3 151.0,193.0" fill="url(#panelWarm)" stroke="#081426" stroke-width="1.4" stroke-linejoin="round"/>
<line x1="104.4" y1="164.5" x2="137.7" y2="158.4" stroke="#0c1f33" stroke-width="0.7" opacity="0.35"/>
<line x1="127.7" y1="178.7" x2="160.6" y2="172.4" stroke="#0c1f33" stroke-width="0.7" opacity="0.35"/>
