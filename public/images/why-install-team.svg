<line x1="60.3" y1="667.8" x2="211.0" y2="647.3" stroke="#0c1f33" stroke-width="0.7" opacity="0.35"/>
<line x1="63.5" y1="694.2" x2="215.1" y2="673.0" stroke="#0c1f33" stroke-width="0.7" opacity="0.35"/>
<polygon points="220.6,619.7 370.3,599.8 385.9,674.8 233.3,696.7" fill="url(#panelWarm)" stroke="#081426" stroke-width="1.4" stroke-linejoin="round"/>
<line x1="224.8" y1="645.4" x2="375.5" y2="624.8" stroke="#0c1f33" stroke-width="0.7" opacity="0.35"/>
<line x1="229.0" y1="671.0" x2="380.7" y2="649.8" stroke="#0c1f33" stroke-width="0.7" opacity="0.35"/>
<polygon points="384.0,598.0 533.7,578.1 552.4,650.8 399.9,672.8" fill="url(#panelWarm)" stroke="#081426" stroke-width="1.4" stroke-linejoin="round"/>
<line x1="389.3" y1="622.9" x2="539.9" y2="602.3" stroke="#0c1f33" stroke-width="0.7" opacity="0.35"/>
<line x1="394.6" y1="647.8" x2="546.2" y2="626.6" stroke="#0c1f33" stroke-width="0.7" opacity="0.35"/>
<!-- panel being fitted -->
<polygon points="352,404 620,372 634,424 366,458" fill="url(#panelGrad)" stroke="#0c1f33" stroke-width="5"/>
<line x1="360" y1="432" x2="628" y2="399" stroke="#0c1f33" stroke-width="2.5" opacity="0.45"/>
