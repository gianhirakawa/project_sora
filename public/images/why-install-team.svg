  <path d="M22,-58 q34,16 54,-8" stroke="#f4801f" stroke-width="17" fill="none" stroke-linecap="round"/>
  <path d="M-22,-58 q-30,20 -46,44" stroke="#f4801f" stroke-width="17" fill="none" stroke-linecap="round"/>
</g>
<g><rect x="760" y="592" width="104" height="64" rx="10" fill="#1f6f5c"/>
<rect x="794" y="574" width="36" height="18" rx="7" fill="#0c1f33"/>
<rect x="778" y="612" width="68" height="8" rx="4" fill="#faf6ee" opacity="0.5"/></g>

<rect width="900" height="700" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:multiply"/>
</svg>
