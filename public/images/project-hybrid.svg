<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" preserveAspectRatio="xMidYMid slice"><title>Hybrid solar home with a battery cabinet sized for brownout backup</title>
<defs>
