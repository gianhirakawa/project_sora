<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" preserveAspectRatio="xMidYMid slice"><title>On-grid: panels feeding the house and the utility grid</title>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#081426"/><stop offset="34%" stop-color="#2b3a52"/>
    <stop offset="60%" stop-color="#8a5a3c"/><stop offset="78%" stop-color="#f4801f"/>
    <stop offset="100%" stop-color="#ffb703"/>
  </linearGradient>
  <linearGradient id="skyMorning" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#9fb4c4"/><stop offset="42%" stop-color="#e7d6bd"/>
    <stop offset="74%" stop-color="#ffd79a"/><stop offset="100%" stop-color="#ffb703"/>
  </linearGradient>
  <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#fff3c4"/><stop offset="45%" stop-color="#ffb703" stop-opacity="0.75"/>
    <stop offset="100%" stop-color="#ffb703" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#16324f"/><stop offset="45%" stop-color="#0c1f33"/>
    <stop offset="72%" stop-color="#274a6b"/><stop offset="100%" stop-color="#0c1f33"/>
  </linearGradient>
  <linearGradient id="panelWarm" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#3b5a76"/><stop offset="40%" stop-color="#12283f"/>
    <stop offset="70%" stop-color="#e39b00" stop-opacity="0.34"/><stop offset="100%" stop-color="#0c1f33"/>
  </linearGradient>
  <linearGradient id="roofFace" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3a4c63"/><stop offset="100%" stop-color="#1a2c42"/></linearGradient>
  <linearGradient id="wallFace" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#f7efe0"/><stop offset="100%" stop-color="#dcc9a8"/></linearGradient>
  <linearGradient id="wallShade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#c2ab8a"/><stop offset="100%" stop-color="#9d8567"/></linearGradient>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/>
    <feColorMatrix type="saturate" values="0"/></filter>
</defs>

<rect width="640" height="260" fill="url(#skyMorning)"/>
<circle cx="540" cy="60" r="150" fill="url(#sunGlow)"/>
<rect y="196" width="640" height="64" fill="#7c9a72"/>

<g>
  <polygon points="70,150 250,118 330,168 150,206" fill="url(#roofFace)"/>
  <polygon points="91.1,150.3 124.9,144.5 193.5,186.3 161.0,193.0" fill="url(#panelGrad)" stroke="#081426" stroke-width="1.4" stroke-linejoin="round"/>
<line x1="114.4" y1="164.5" x2="147.7" y2="158.4" stroke="#0c1f33" stroke-width="0.7" opacity="0.35"/>
<line x1="137.7" y1="178.7" x2="170.6" y2="172.4" stroke="#0c1f33" stroke-width="0.7" opacity="0.35"/>
<polygon points="129.1,143.7 162.8,138.0 230.0,178.8 197.6,185.5" fill="url(#panelGrad)" stroke="#081426" stroke-width="1.4" stroke-linejoin="round"/>
<line x1="151.9" y1="157.7" x2="185.2" y2="151.6" stroke="#0c1f33" stroke-width="0.7" opacity="0.35"/>
<line x1="174.7" y1="171.6" x2="207.6" y2="165.2" stroke="#0c1f33" stroke-width="0.7" opacity="0.35"/>
<polygon points="167.1,137.2 200.8,131.4 266.5,171.3 234.1,178.0" fill="url(#panelGrad)" stroke="#081426" stroke-width="1.4" stroke-linejoin="round"/>
<line x1="189.4" y1="150.8" x2="222.7" y2="144.7" stroke="#0c1f33" stroke-width="0.7" opacity="0.35"/>
<line x1="211.8" y1="164.4" x2="244.6" y2="158.0" stroke="#0c1f33" stroke-width="0.7" opacity="0.35"/>
<polygon points="205.1,130.7 238.8,124.9 303.0,163.9 270.6,170.5" fill="url(#panelGrad)" stroke="#081426" stroke-width="1.4" stroke-linejoin="round"/>
<line x1="226.9" y1="144.0" x2="260.2" y2="137.9" stroke="#0c1f33" stroke-width="0.7" opacity="0.35"/>
<line x1="248.8" y1="157.2" x2="281.6" y2="150.9" stroke="#0c1f33" stroke-width="0.7" opacity="0.35"/>
  <polygon points="150,206 330,168 330,196 150,240" fill="url(#wallFace)"/>
  <polygon points="70,150 150,206 150,240 70,196" fill="url(#wallShade)"/>
</g>
<g stroke="#0c1f33" stroke-width="6" fill="none" stroke-linecap="round">
  <path d="M470,196 L470,70"/><path d="M430,92 L510,92"/><path d="M440,120 L500,120"/>
</g>
<path d="M340,168 Q408,132 462,110" stroke="#ffb703" stroke-width="7" stroke-dasharray="16 12" fill="none" stroke-linecap="round"/>
<path d="M395,150 l-12,20 h10 l-6,18 16,-24 h-10 z" fill="#e39b00"/>
<rect width="640" height="260" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:multiply"/>
</svg>
